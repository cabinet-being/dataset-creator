<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Workspace viewport checks</title><style>body{margin:0;background:#ddd;font:14px system-ui}header{padding:8px}iframe{display:block;border:0;background:white}label{margin-right:16px}</style></head><body><header><label>Viewport <select id="viewport" aria-label="Workspace viewport"><option value="1280,720">1280 × 720</option><option value="640,720">640 × 720</option><option value="320,720">320 × 720</option></select></label></header><iframe title="Dataset Creator test viewport" id="workspace" src="../?tool=import" width="1280" height="720"></iframe><script>document.getElementById('viewport').addEventListener('change',event=>{const [width,height]=event.target.value.split(',');const frame=document.getElementById('workspace');frame.width=width;frame.height=height;});</script></body></html>
